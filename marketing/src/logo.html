<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:500px;overflow:hidden;background:transparent}
  .wrap{position:relative;width:1200px;height:500px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .title{font-family:'Fredoka',sans-serif;font-weight:700;font-size:118px;letter-spacing:3px;line-height:1;white-space:nowrap;
    color:#fff4dc;-webkit-text-stroke:10px #13303d;paint-order:stroke fill;
    text-shadow:0 10px 0 #0b2230, 0 18px 30px rgba(0,0,0,.35)}
  .title span{color:#ffba49}
  .sub{margin-top:18px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:56px;letter-spacing:10px;
    color:#40cdc3;-webkit-text-stroke:6px #13303d;paint-order:stroke fill}
  .wave{position:absolute;bottom:40px;width:760px;height:18px}
</style></head>
<body><div class="wrap">
  <div class="title">SURVIVAL <span>ISLAND</span></div>
  <div class="sub">A MARÉ SOMBRIA</div>
  <svg class="wave" viewBox="0 0 760 18"><path d="M0 9 Q47 0 95 9 T190 9 T285 9 T380 9 T475 9 T570 9 T665 9 T760 9" stroke="#40cdc3" stroke-width="5" fill="none" opacity=".8"/></svg>
</div></body></html>
